name: Build manual PDF

on:
  push:
    paths:
      - "M0SS-416-manual.md"
      - "manual.css"
      - "images/**"
      - ".github/workflows/build-manual-pdf.yml"
  pull_request:
    paths:
      - "M0SS-416-manual.md"
      - "manual.css"
      - "images/**"
      - ".github/workflows/build-manual-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone HTML
        uses: docker://pandoc/core:3.10
        with:
          args: >-
            M0SS-416-manual.md
            -s --toc --number-sections
            --css manual.css
            --embed-resources
            -o M0SS-416-manual.html

      - name: Print PDF
        run: |
          google-chrome \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --print-to-pdf=M0SS-416-manual.pdf \
            --print-to-pdf-no-header \
            "file://$PWD/M0SS-416-manual.html"

      - name: Commit PDF
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M0SS-416-manual.pdf
          git diff --cached --quiet || git commit -m "Build manual PDF"
          git push

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: M0SS-416-manual-pdf
          path: M0SS-416-manual.pdf
